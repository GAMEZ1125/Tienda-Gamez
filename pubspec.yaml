name: tienda_gamez
description: "Tienda Gamez - Sistema POS para gestión de tienda"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  go_router: ^14.8.1
  get_it: ^8.0.3
  equatable: ^2.0.7
  intl: ^0.20.2
  path: ^1.9.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  mobile_scanner: ^7.2.0
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  google_sign_in: ^6.3.0
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  http: ^1.3.0
  workmanager: ^0.6.0
  csv: ^8.0.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  pdf: ^3.12.0
  printing: ^5.14.3
  table_calendar: ^3.2.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/TiendaGamez.png
    - assets/images/TiendaGamez_logo.png
    - assets/ico/TiendaGamez.ico
